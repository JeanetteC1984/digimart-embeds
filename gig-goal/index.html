<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gig Goal Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Digimart colors. Override in the link, e.g. ?cyan=00BEE8&pink=E30C84 (no #). */
  :root {
    --cyan: #00BEE8;
    --pink: #E30C84;
    --bg: #050507;
    --card: #0B0A12;
    --track: #1F1B2E;
    --text: #F4F2FF;
    --muted: #A49FBF;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); }
  body {
    font-family: "Poppins", system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--text);
    padding: 10px;
    -webkit-font-smoothing: antialiased;
  }
  .card {
    position: relative;
    max-width: 880px;
    margin: 0 auto;
    padding: 20px 22px 18px;
    border-radius: 20px;
    background:
      radial-gradient(120% 140% at 0% 0%, rgba(0,190,232,.10), transparent 55%),
      radial-gradient(120% 140% at 100% 100%, rgba(227,12,132,.12), transparent 55%),
      var(--card);
    border: 1px solid rgba(227,12,132,.35);
    box-shadow: 0 0 28px rgba(227,12,132,.18), 0 0 2px rgba(0,190,232,.5) inset;
    overflow: hidden;
  }
  /* faint scanlines for the neon look */
  .card::before {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(0deg, rgba(255,255,255,.025) 0 1px, transparent 1px 3px);
  }
  .orb { font-family: "Orbitron", "Arial Black", sans-serif; }

  .top { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
  .label {
    font-size: 12px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase;
    color: var(--cyan); text-shadow: 0 0 10px rgba(0,190,232,.7);
  }
  .label b { color: var(--pink); text-shadow: 0 0 10px rgba(227,12,132,.7); }
  .week { font-size: 12px; color: var(--muted); }
  .week strong { color: var(--text); font-weight: 600; }

  .amounts { display: flex; align-items: baseline; gap: 10px; margin: 10px 0 22px; flex-wrap: wrap; }
  .earned { font-size: clamp(28px, 6vw, 40px); font-weight: 800; line-height: 1; letter-spacing: .02em;
    background: linear-gradient(90deg, #fff, #CFF6FF); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 10px rgba(0,190,232,.35)); }
  .of { font-size: 15px; color: var(--muted); font-weight: 500; }
  .of strong { color: var(--text); }
  .pct {
    margin-left: auto; font-size: 14px; font-weight: 800; color: #fff;
    padding: 5px 12px; border-radius: 999px;
    background: linear-gradient(90deg, var(--cyan), var(--pink));
    box-shadow: 0 0 14px rgba(227,12,132,.45);
  }

  /* The bar */
  .barwrap { position: relative; padding-top: 4px; }
  .bar {
    position: relative; height: 22px; border-radius: 999px; background: var(--track);
    box-shadow: 0 0 0 1px rgba(255,255,255,.05) inset;
    overflow: visible;
  }
  .fill {
    position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: 999px;
    background: linear-gradient(90deg, var(--cyan), var(--pink));
    box-shadow: 0 0 12px rgba(0,190,232,.55), 0 0 22px rgba(227,12,132,.45);
    transition: width 1s cubic-bezier(.2,.8,.2,1);
    overflow: hidden;
  }
  .fill::after { /* moving shine */
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(100deg, transparent 20%, rgba(255,255,255,.35) 45%, transparent 70%);
    transform: translateX(-100%); animation: shine 2.8s ease-in-out infinite;
  }
  @keyframes shine { to { transform: translateX(100%); } }
  .tick { position: absolute; top: 4px; bottom: 4px; width: 2px; background: rgba(5,5,7,.55); border-radius: 2px; z-index: 2; }
  .pace {
    position: absolute; top: -6px; bottom: -6px; width: 2px; z-index: 3;
    background: #fff; box-shadow: 0 0 8px #fff; border-radius: 2px;
    transition: left 1s cubic-bezier(.2,.8,.2,1);
  }
  .pace span {
    position: absolute; top: -18px; left: 50%; transform: translateX(-50%);
    font-size: 10px; font-weight: 600; white-space: nowrap; color: var(--muted); letter-spacing: .04em;
  }
  .scale { display: flex; justify-content: space-between; font-size: 10px; color: var(--muted); margin-top: 6px; padding: 0 2px; }

  .status { margin-top: 12px; font-size: 14px; font-weight: 600; }
  .status.ahead { color: var(--cyan); text-shadow: 0 0 8px rgba(0,190,232,.5); }
  .status.behind { color: #FF7DC3; }
  .status.done { color: #fff; text-shadow: 0 0 10px rgba(227,12,132,.9); }

  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 14px; }
  .stat {
    padding: 10px 12px; border-radius: 14px; background: rgba(31,27,46,.7);
    border: 1px solid rgba(255,255,255,.06);
  }
  .stat .k { font-size: 10px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); font-weight: 600; }
  .stat .v { font-size: 17px; font-weight: 800; margin-top: 3px; }
  .stat:nth-child(odd) .v { color: var(--cyan); }
  .stat:nth-child(even) .v { color: #FF5DB1; }

  .controls { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; align-items: center; }
  button, .btn {
    font: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
    border: 1.5px solid var(--cyan); color: var(--cyan); background: transparent;
    border-radius: 999px; padding: 6px 14px; line-height: 1.2;
    transition: box-shadow .2s, background .2s, color .2s;
  }
  button:hover { box-shadow: 0 0 12px rgba(0,190,232,.6); }
  button.pink { border-color: var(--pink); color: #FF5DB1; }
  button.pink:hover { box-shadow: 0 0 12px rgba(227,12,132,.6); }
  button.solid { background: linear-gradient(90deg, var(--cyan), var(--pink)); color: #fff; border-color: transparent; }
  button.ghost { border-color: rgba(255,255,255,.18); color: var(--muted); }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--pink); outline-offset: 2px; }
  .spacer { flex: 1; }
  .add { display: flex; gap: 6px; align-items: center; }
  input {
    font: inherit; font-size: 14px; padding: 6px 12px; border-radius: 999px; width: 110px;
    border: 1.5px solid var(--track); color: var(--text); background: var(--track);
  }
  input::placeholder { color: #6f6a88; }
  .panel { display: none; margin-top: 12px; gap: 8px; flex-wrap: wrap; align-items: end; }
  .panel.open { display: flex; }
  .panel label { font-size: 11px; font-weight: 600; color: var(--muted); display: flex; flex-direction: column; gap: 4px; }
  .panel input { width: 140px; border-radius: 12px; }
  .hidden { display: none !important; }

  .card.won { border-color: rgba(0,190,232,.6); animation: pulse 2.4s ease-in-out infinite; }
  @keyframes pulse {
    0%,100% { box-shadow: 0 0 22px rgba(227,12,132,.30), 0 0 2px rgba(0,190,232,.5) inset; }
    50% { box-shadow: 0 0 40px rgba(0,190,232,.45), 0 0 2px rgba(0,190,232,.5) inset; }
  }
  .brand { position: absolute; right: 16px; bottom: 10px; font-size: 9px; letter-spacing: .18em; color: rgba(164,159,191,.5); }
  .brand b { color: rgba(0,190,232,.7); } .brand i { font-style: normal; color: rgba(227,12,132,.7); }

  @media (max-width: 560px) {
    .card { padding: 16px; }
    .stats { grid-template-columns: repeat(2, 1fr); }
    .pct { margin-left: 0; }
    .brand { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .fill::after, .card.won { animation: none; }
    .fill, .pace { transition: none; }
  }
</style>
</head>
<body>
<main class="card" id="card">
  <div class="top">
    <span class="label orb">Weekly <b>Goal</b> Tracker</span>
    <span class="week" id="week"><strong>Week of Nov 17</strong> · 3 days left</span>
  </div>

  <div class="amounts">
    <span class="earned orb" id="earned">$512.40</span>
    <span class="of" id="of">of <strong>$800</strong> goal</span>
    <span class="pct orb" id="pct">64%</span>
  </div>

  <div class="barwrap">
    <div class="bar" id="bar" role="progressbar" aria-label="Weekly goal progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="64">
      <div class="fill" id="fill" style="width:64%"></div>
      <div class="tick" style="left:25%"></div>
      <div class="tick" style="left:50%"></div>
      <div class="tick" style="left:75%"></div>
      <div class="pace" id="pace" style="left:57%"><span>Pace</span></div>
    </div>
    <div class="scale"><span>$0</span><span id="s25">$200</span><span id="s50">$400</span><span id="s75">$600</span><span id="s100">$800</span></div>
  </div>

  <div class="status ahead" id="status">⚡ $56 ahead of pace. Keep it rolling!</div>

  <div class="stats">
    <div class="stat"><div class="k">To go</div><div class="v orb" id="toGo">$287.60</div></div>
    <div class="stat"><div class="k">Needed per day</div><div class="v orb" id="perDay">$95.87</div></div>
    <div class="stat"><div class="k">Shifts logged</div><div class="v orb" id="shifts">6</div></div>
    <div class="stat"><div class="k">Avg per shift</div><div class="v orb" id="avg">$85.40</div></div>
  </div>

  <div class="controls hidden" id="controls">
    <button type="button" data-add="25">+ $25</button>
    <button type="button" data-add="50">+ $50</button>
    <button type="button" data-add="100">+ $100</button>
    <form class="add" id="addForm">
      <input id="addAmt" type="number" step="0.01" min="0" inputmode="decimal" placeholder="Shift $" aria-label="Amount earned this shift">
      <button class="solid" type="submit">Log shift</button>
    </form>
    <span class="spacer"></span>
    <button class="ghost" type="button" id="undoBtn">Undo</button>
    <button class="pink" type="button" id="goalBtn">Set goal</button>
  </div>

  <form class="panel" id="goalPanel">
    <label>Weekly goal ($)<input id="goalIn" type="number" step="1" min="1" inputmode="decimal"></label>
    <button class="solid" type="submit">Save goal</button>
    <button class="ghost" type="button" id="resetBtn">Clear this week</button>
  </form>

</main>

<script>
(function () {
  var q = new URLSearchParams(location.search);
  var root = document.documentElement.style;
  [["cyan","cyan"],["pink","pink"],["bg","bg"],["card","card"]].forEach(function (p) {
    var v = q.get(p[0]);
    if (v && /^[0-9a-fA-F]{3,8}$/.test(v)) root.setProperty("--" + p[1], "#" + v);
  });
  var cur = q.get("currency") || "$";
  var $ = function (id) { return document.getElementById(id); };

  // Week runs Monday to Sunday (?weekstart=sun for Sunday to Saturday). Resets on its own each week.
  var now = new Date();
  var start = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  start.setDate(start.getDate() - (q.get("weekstart") === "sun" ? start.getDay() : (start.getDay() + 6) % 7));
  var end = new Date(start); end.setDate(end.getDate() + 7);
  var key = "digimartGigGoal:" + start.toISOString().slice(0, 10);

  function load(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }
  function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

  var fixed = q.has("earned"); // ?goal=800&earned=512 shows fixed numbers, no buttons
  var state = load(key) || { goal: load("digimartGigGoal:goal") || 800, entries: [] };
  if (q.has("goal")) state.goal = parseFloat(q.get("goal")) || state.goal;
  if (fixed) state.entries = [parseFloat(q.get("earned")) || 0];
  if (q.has("shifts") && fixed) state.fixedShifts = parseInt(q.get("shifts"), 10) || 0;
  if (!fixed && q.get("readonly") !== "1") $("controls").classList.remove("hidden");

  function money(n) {
    var r = Math.round(n * 100) / 100;
    return cur + r.toLocaleString(undefined, { minimumFractionDigits: r % 1 ? 2 : 0, maximumFractionDigits: 2 });
  }
  function shortMoney(n) { return n >= 10000 ? cur + Math.round(n / 1000) + "k" : cur + Math.round(n).toLocaleString(); }

  function render() {
    var goal = Math.max(1, state.goal);
    var earned = state.entries.reduce(function (a, b) { return a + b; }, 0);
    var shifts = state.fixedShifts != null ? state.fixedShifts : state.entries.filter(function (x) { return x > 0; }).length;
    var pct = earned / goal * 100;
    var msLeft = end - now;
    var daysLeft = Math.max(1, Math.ceil(msLeft / 86400000));
    var elapsed = Math.min(1, Math.max(0, (now - start) / (end - start)));
    var pacePct = elapsed * 100;
    var paceAmt = goal * elapsed;
    var diff = earned - paceAmt;

    $("week").innerHTML = "<strong>Week of " + start.toLocaleDateString(undefined, { month: "short", day: "numeric" }) +
      "</strong> · " + daysLeft + (daysLeft === 1 ? " day" : " days") + " left";
    $("earned").textContent = money(earned);
    $("of").innerHTML = "of <strong>" + money(goal) + "</strong> goal";
    $("pct").textContent = Math.floor(pct) + "%";
    $("fill").style.width = Math.min(100, pct) + "%";
    $("bar").setAttribute("aria-valuenow", Math.min(100, Math.round(pct)));
    $("pace").style.left = "calc(" + pacePct + "% - 1px)";
    $("pace").firstChild.style.transform = pacePct > 90 ? "translateX(-100%)" : pacePct < 10 ? "translateX(0)" : "translateX(-50%)";
    $("s25").textContent = shortMoney(goal * .25);
    $("s50").textContent = shortMoney(goal * .5);
    $("s75").textContent = shortMoney(goal * .75);
    $("s100").textContent = shortMoney(goal);

    var toGo = Math.max(0, goal - earned);
    $("toGo").textContent = money(toGo);
    $("perDay").textContent = toGo ? money(toGo / daysLeft) : "Done";
    $("shifts").textContent = shifts;
    $("avg").textContent = shifts ? money(earned / shifts) : "–";

    var s = $("status");
    if (earned >= goal) {
      s.className = "status done"; s.textContent = "🎉 Goal smashed! You're " + money(earned - goal) + " over. Treat yourself.";
      $("card").classList.add("won");
    } else {
      $("card").classList.remove("won");
      if (earned === 0) { s.className = "status ahead"; s.textContent = "🚗 Log your first shift to start the bar."; }
      else if (diff >= 0) { s.className = "status ahead"; s.textContent = "⚡ " + money(Math.round(diff)) + " ahead of pace. Keep it rolling!"; }
      else { s.className = "status behind"; s.textContent = "🎯 " + money(Math.round(-diff)) + " behind pace. One good shift closes the gap."; }
    }
    if (!fixed) { save(key, state); save("digimartGigGoal:goal", state.goal); }
  }

  function add(n) { if (n > 0) { state.entries.push(n); render(); } }
  Array.prototype.forEach.call(document.querySelectorAll("[data-add]"), function (b) {
    b.addEventListener("click", function () { add(parseFloat(b.getAttribute("data-add"))); });
  });
  $("addForm").addEventListener("submit", function (e) {
    e.preventDefault(); add(parseFloat($("addAmt").value)); $("addAmt").value = "";
  });
  $("undoBtn").addEventListener("click", function () { state.entries.pop(); render(); });
  $("goalBtn").addEventListener("click", function () {
    $("goalPanel").classList.toggle("open"); $("goalIn").value = state.goal; $("goalIn").focus();
  });
  $("goalPanel").addEventListener("submit", function (e) {
    e.preventDefault(); var g = parseFloat($("goalIn").value);
    if (g > 0) { state.goal = g; $("goalPanel").classList.remove("open"); render(); }
  });
  $("resetBtn").addEventListener("click", function () {
    if (confirm("Clear everything logged this week?")) { state.entries = []; $("goalPanel").classList.remove("open"); render(); }
  });
  render();
})();
</script>
</body>
</html>
